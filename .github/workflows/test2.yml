name: Test Grandeur workflow profile test2

on: [pull_request, workflow_dispatch]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
  
jobs:

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main
            
      - name: Clean up Disk space
        uses: jlumbroso/free-disk-space@main
            
      - name: Install Nextflow
        run: |
          wget -qO- get.nextflow.io | bash
          sudo mv nextflow /usr/local/bin/

          nextflow -version

      - name: Test ENA connectivity
        run: |
          echo "=== DNS ==="
          getent hosts www.ebi.ac.uk

          echo "=== ENA ==="
          time curl -I -L --max-time 30 \
            "https://www.ebi.ac.uk/ena/browser/api/fasta/SRR22314959"

          echo "=== FTP ==="
          time curl -I -L --max-time 30 \
            "https://ftp.sra.ebi.ac.uk/"

      - name: Test enaDataGet
        run: |
          docker run --rm staphb/enabrowsertools:1.7.2 enaDataGet -v

          timeout 120 docker run --rm \
            staphb/enabrowsertools:1.7.2 \
            enaDataGet -f fastq SRR22314959
          
      - name: Run Grandeur
        run: |
          nextflow run . -profile docker,test2 -c .github/workflows/github_actions.config --publish_dir_mode link
          
      - name: Check contig files
        run: |
          for file in grandeur/contigs/*_contigs.fa grandeur/grandeur_summary.tsv
          do
            head $file
            wc -l $file
          done      

      - name: tree
        run: tree grandeur*
