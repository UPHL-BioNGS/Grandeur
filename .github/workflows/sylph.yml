name: Test Grandeur with SYLPH database

on: [pull_request, workflow_dispatch]

jobs:

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
            
      - name: Clean up Disk space
        uses: jlumbroso/free-disk-space@main
            
      - name: Install Nextflow
        run: |
          wget -qO- get.nextflow.io | bash
          sudo mv nextflow /usr/local/bin/

          nextflow -version

      - name: Download SYLPH database
        run: |
            wget http://faust.compbio.cs.cmu.edu/sylph-stuff/gtdb-r226-c1000-dbv1.syldb

      - name: Run Grandeur
        run: |
          nextflow run . -profile docker,test -c .github/workflows/github_actions.config --publish_dir_mode link --sylph_db gtdb-r226-c1000-dbv1.syldb
          
      - name: Check contig files
        run: |
          for file in grandeur/contigs/*_contigs.fa grandeur/grandeur_summary.tsv grandeur/sylph/sylph_summary.tsv
          do
            head $file
            wc -l $file
          done      

      - name: tree
        run: tree grandeur*
