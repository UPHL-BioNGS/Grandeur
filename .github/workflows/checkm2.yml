name: Test Grandeur with CHECKM2 database

on: [pull_request, workflow_dispatch]

jobs:

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
            
      - name: Clean up Disk space
        uses: jlumbroso/free-disk-space@main
            
      - name: Install Nextflow
        run: |
          wget -qO- get.nextflow.io | bash
          sudo mv nextflow /usr/local/bin/

          nextflow -version

      - name: Download CHECKM2 database
        run: |
            wget https://zenodo.org/records/14897628/files/checkm2_database.tar.gz
            tar -vxf checkm2_database.tar.gz

      - name: Run Grandeur
        run: |
          nextflow run . -profile docker,test -c .github/workflows/github_actions.config --publish_dir_mode link --checkm2_db CheckM2_database/uniref100.KO.1.dmnd
          
      - name: Check contig files
        run: |
          for file in grandeur/contigs/*_contigs.fa grandeur/grandeur_summary.tsv grandeur/checkm2/checkm2_summary.tsv
          do
            head $file
            wc -l $file
          done      

      - name: tree
        run: tree grandeur*
