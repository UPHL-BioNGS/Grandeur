name: "report"
description: >-
  Generates final pipeline reports by collating software versions, preparing data for MultiQC, 
  running MultiQC to create an HTML report, and executing a custom Python script to create 
  a comprehensive Grandeur summary TSV.
keywords:
  - report
  - multiqc
  - summary
  - versions
  - qc
components:
  - mqc/prep
  - multiqc
  - summary
  - versions
  - concat/reports
input:
  - ch_reads:
      type: tuple
      description: Channel containing sample metadata and paired-end FASTQ reads
  - ch_fastas:
      type: tuple
      description: Channel containing sample metadata and FASTA files
  - for_multiqc:
      type: file
      description: Combined channel of all output files routed to MultiQC for reporting
  - for_summary:
      type: file
      description: Combined channel of summary CSV/TSV/JSON files generated by previous subworkflows
  - ch_versions:
      type: file
      description: Channel containing software versions emitted by all executed tools
      pattern: "versions.yml"
  - multiqc_script:
      type: file
      description: Python script (for_multiqc.py) used to prep outputs before running MultiQC
  - version_script:
      type: file
      description: Python script (versions.py) used to convert versions.yml for MultiQC
output:
  - summary:
      type: file
      description: The final generated Grandeur summary TSV file (currently emitted as empty, but tracks the intended SUMMARY output)
  - versions:
      type: file
      description: Collated file containing all software versions from the pipeline run
      pattern: "versions.yml"
authors:
  - "@erinyoung"