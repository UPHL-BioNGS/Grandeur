name: "quality_assessment"
description: >-
  Runs quality assessment on raw reads and assembled contigs. Performs read QC with FastQC, 
  and evaluates assemblies using QUAST, AMRFinderPlus, MLST, PlasmidFinder, and optionally CheckM2.
keywords:
  - quality control
  - qc
  - fastqc
  - quast
  - amr
  - mlst
  - plasmids
  - checkm2
components:
  - fastqc
  - amrfinder
  - quast
  - mlst
  - plasmidfinder
  - checkm2
  - concat/reports
input:
  - ch_raw_reads:
      type: tuple
      description: Channel containing sample metadata and raw paired-end FASTQ reads
  - ch_clean_reads:
      type: tuple
      description: Channel containing sample metadata and cleaned/filtered FASTQ reads
  - ch_fastas_without_reads:
      type: tuple
      description: Channel containing sample metadata and FASTA files that do not have associated reads
  - ch_all_fastas:
      type: tuple
      description: Channel containing sample metadata and all FASTA files (both user-provided and assembled)
  - ch_reads_contigs:
      type: tuple
      description: Tuple containing sample metadata, cleaned reads, and the assembled contigs (used for QUAST)
  - ch_contigs_org:
      type: tuple
      description: Tuple containing sample metadata, organism prediction, and assembled contigs (used for AMRFinderPlus)
  - ch_checkm2_db:
      type: directory
      description: Channel containing the CheckM2 database directory
  - summfle_script:
      type: file
      description: Python script used for summarizing output files
output:
  - for_summary:
      type: file
      description: Combined channel of summary CSV/TSV/JSON files generated by FastQC, AMRFinderPlus, QUAST, MLST, PlasmidFinder, and CheckM2
  - for_multiqc:
      type: file
      description: Combined channel of output files routed to MultiQC for reporting (FastQC and QUAST outputs)
  - versions:
      type: file
      description: File containing software versions
      pattern: "versions.yml"
authors:
  - "@erinyoung"